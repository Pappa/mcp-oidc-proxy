[project]
name = "mcp-oidc-proxy"
version = "0.1.0"
description = "Local demo OIDC provider and FastMCP OIDC proxy prototype"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["apps/auth-server"]

[dependency-groups]
dev = [
    "auth-server",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[tool.uv.sources]
auth-server = { workspace = true }

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = ["tests", "apps/auth-server/src"]
addopts = [
    "-m",
    "not smoke",
    "--cov=auth_server",
    "--cov-report=html",
    "--cov-report=json:.coverage.json",
]
markers = [
    "smoke: end-to-end smoke tests that spawn real server subprocesses",
    "integration: integration tests that spawn the auth server subprocess",
]

[tool.coverage.run]
branch = true
source = ["apps/auth-server/src/auth_server"]
omit = [".scratch/*"]

[tool.coverage.report]
fail_under = 95
skip_empty = true

[tool.ruff]
exclude = [".scratch/*"]

[tool.ruff.format]
exclude = [".scratch/*"]
