[project]
name = "mcp-oidc-proxy"
version = "0.1.0"
description = "Local demo OIDC provider and FastMCP OIDC proxy prototype"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.0",
    "nanoidp>=2.8.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
launch-mcp = "mcp_oidc_proxy.launch_mcp:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_oidc_proxy"]

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = ["tests", "src"]
asyncio_mode = "auto"
addopts = [
    "-m",
    "not smoke",
]
markers = [
    "smoke: end-to-end smoke tests that spawn real server subprocesses",
    "integration: integration tests that spawn the auth server subprocess",
]

[tool.coverage.run]
branch = true
source = ["src/mcp_oidc_proxy"]
omit = [".scratch/*"]

[tool.coverage.report]
fail_under = 95
skip_empty = true

[tool.ruff]
exclude = [".scratch/*"]

[tool.ruff.format]
exclude = [".scratch/*"]
