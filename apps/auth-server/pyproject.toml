[project]
name = "auth-server"
version = "0.1.0"
description = "Demo OIDC identity provider for local MCP OIDC proxy development"
requires-python = ">=3.14"
dependencies = [
    "nanoidp>=2.8.0",
]

[project.scripts]
auth-server = "auth_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth_server"]
